<title>One Umbrella Clicker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Manrope:wght@600;700;800&family=DM+Mono:wght@400&display=swap">
<style>
  /* Layout: one fixed 1920×1080 stage scaled to the window; nine beats, one on screen at a time,
     advanced by click or keyboard. Single dark look by design: it is shown on a meeting screen. */
  :root { --ground:#121816; --main:#4fc3a6; --second:#e8ece9; --accent:#e2b04a; --display:"Inter", system-ui, sans-serif; --sans:"Manrope", system-ui, sans-serif; --mono:"DM Mono", ui-monospace, Menlo, monospace; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--second); font-family: var(--sans); overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; cursor: pointer; user-select: none; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: center center; overflow: hidden; border-radius: 12px; background: var(--ground); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .scene.on { visibility: visible; }
  /* the film's shared look */
  .ground { position:absolute; inset:0; background:radial-gradient(90% 70% at 50% 110%, color-mix(in srgb, var(--main) 18%, var(--ground)), var(--ground)) }
  .words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } .words > * { margin:0 }
  .line { font-family:var(--display); font-size:84px; line-height:1.05; font-weight:800; text-wrap: balance } .sub { font-size:36px; line-height:1.3; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }
  .big { font-family:var(--display); font-size:132px; line-height:1; font-weight:800; text-wrap: balance }
  .kicker { font-size:26px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--main) }
  .sock { position:absolute; box-sizing:border-box; border:3px solid color-mix(in srgb, var(--second) 55%, var(--ground)); border-radius:14px; background:color-mix(in srgb, var(--ground) 90%, var(--second)); display:flex; align-items:center; justify-content:center; text-align:center; font-weight:700; font-size:30px; line-height:1.15; padding:0 18px; box-shadow:0 10px 30px rgba(0,0,0,.25) }
  .sock.partner { border-color:color-mix(in srgb, var(--second) 80%, var(--ground)) }
  .sock.core { border-color:var(--main); color:var(--main) }
  .sock.customer { border-color:var(--accent) }
  .sock.bad { border-style:dashed; border-color:var(--accent); color:var(--accent) }
  .sock.hub { background:color-mix(in srgb, var(--main) 22%, var(--ground)); border-color:var(--main); font-size:38px }
  .code { font-family:var(--mono); font-size:26px; font-weight:400 }
  .tag { position:absolute; margin:0; font-family:var(--mono); font-size:24px; padding:6px 14px; border-radius:8px; background:color-mix(in srgb, var(--ground) 86%, var(--second)); color:var(--second); white-space:nowrap }
  .tag.bad { color:var(--accent) } .tag.good { color:var(--main) }
  .art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
  .cable { fill:none; stroke:color-mix(in srgb, var(--second) 60%, var(--ground)); stroke-width:6; stroke-linecap:round; stroke-linejoin:round }
  .cable.main { stroke:var(--main) } .cable.bad { stroke:var(--accent) } .cable.thin { stroke-width:4 }
  .head { fill:color-mix(in srgb, var(--second) 60%, var(--ground)) } .head.main { fill:var(--main) } .head.bad { fill:var(--accent) }
  .dot { position:absolute; width:18px; height:18px; border-radius:50%; background:var(--main); box-shadow:0 0 0 6px color-mix(in srgb, var(--main) 25%, transparent) }
  /* presenter chrome */
  #hud { position: absolute; left: 40px; bottom: 28px; display: flex; align-items: center; gap: 18px; font-size: 22px; color: color-mix(in srgb, var(--second) 55%, var(--ground)); pointer-events: none; }
  #hud b { color: var(--second); font-weight: 700; }
  #hud .hint { font-family: var(--mono); font-size: 18px; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: color-mix(in srgb, var(--second) 10%, var(--ground)); }
  #bar i { display: block; height: 100%; width: 0; background: var(--main); }
  #dots { position: absolute; right: 40px; bottom: 32px; display: flex; gap: 10px; pointer-events: none; }
  #dots i { width: 14px; height: 14px; border-radius: 50%; background: color-mix(in srgb, var(--second) 18%, var(--ground)); }
  #dots i.done { background: color-mix(in srgb, var(--main) 55%, var(--ground)); } #dots i.now { background: var(--main); }
  #start { position: absolute; inset: 0; display: grid; place-items: end center; padding-bottom: 120px; pointer-events: none; }
  #start span { font-family: var(--mono); font-size: 26px; color: var(--main); padding: 12px 22px; border: 2px solid var(--main); border-radius: 999px; background: color-mix(in srgb, var(--ground) 80%, transparent); }
  #tools { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
  #tools button { font: inherit; font-size: 13px; font-weight: 700; color: var(--second); background: color-mix(in srgb, var(--second) 12%, var(--ground)); border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  #tools button:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { #start span { transition: none; } }
</style>

<div id="tools">
  <button type="button" id="btn-prev" aria-label="Previous beat">◀</button>
  <button type="button" id="btn-replay">Replay beat</button>
  <button type="button" id="btn-next">Next ▶</button>
  <button type="button" id="btn-full">Fullscreen</button>
</div>
<div id="wrap">
  <div id="stage">
    <div id="start"><span>Click, Space or → to advance · ← back · R replays</span></div>
    <div id="hud"><span><b id="hud-n">1</b> / 9</span><span id="hud-name"></span></div>
    <div id="dots"></div>
    <div id="bar"><i id="bar-fill"></i></div>
  </div>
</div>

<script>
(function () {
  // ---- a small kit: the helpers the scenes were written against ----
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, k) => a + (b - a) * k;
  const eo = x => 1 - Math.pow(1 - x, 3);
  const ei = x => x * x * x;
  const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const eob = (x, s) => { s = s || 1.4; const c = s * 1.0; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  function rng(seed) { let a = (seed | 0) + 0x6D2B79F5; return function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function h(html) { const tpl = document.createElement('template'); tpl.innerHTML = html.trim(); return tpl.content.firstElementChild; }
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const TextFx = {
    fadeFromRight(el, t, t0, o) {
      o = o || {}; const stagger = o.stagger ?? 0.11, dur = o.dur ?? 0.5, dx = o.dx ?? 26;
      if (!el._fx) { const words = el.textContent.trim().split(/\s+/); el.innerHTML = words.map(w => '<span style="display:inline-block;white-space:pre">' + esc(w) + ' </span>').join(''); el._fx = Array.from(el.children); }
      el._fx.forEach((sp, i) => { const k = eo(seg(t, t0 + i * stagger, t0 + i * stagger + dur)); sp.style.opacity = k; sp.style.transform = 'translateX(' + (1 - k) * dx + 'px)'; });
      return t0 + el._fx.length * stagger + dur;
    }
  };
  const SCENES = {};
  const kit = { seg, lerp, clamp01, eo, ei, eio, eob, rng, h, TextFx, scene(id, def) { SCENES[id] = def; } };
  window.kit = kit;

  // ---- the film's shared drawing helpers ----
  window.UI = {
    px(n) { return Math.round(n) + 'px'; },
    sock(kit, cls, x, y, w, h, label, extra) { return kit.h('<div class="sock ' + cls + '" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;' + (extra || '') + '">' + label + '</div>'); },
    art(kit) { const s = kit.h('<svg class="art" viewBox="0 0 1920 1080"></svg>'); kit.stage.append(s); return s; },
    cable(svg, d, cls, end) {
      const NS = 'http://www.w3.org/2000/svg';
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d); p.setAttribute('class', 'cable ' + (cls || ''));
      svg.append(p);
      let len = 0, head = null;
      try { len = p.getTotalLength(); } catch (e) { len = 1000; }
      if (end) { head = document.createElementNS(NS, 'polygon'); head.setAttribute('points', '0,-11 20,0 0,11'); head.setAttribute('class', 'head ' + (cls || '')); svg.append(head); }
      const bad = (cls || '').indexOf('bad') >= 0;
      return { el: p, len,
        draw(k) {
          k = Math.max(0, Math.min(1, k));
          p.style.opacity = k > 0 ? 1 : 0;
          if (bad && k >= 1) { p.style.strokeDasharray = '14 12'; p.style.strokeDashoffset = 0; }
          else { p.style.strokeDasharray = len; p.style.strokeDashoffset = len * (1 - k); }
          if (head) {
            const q = p.getPointAtLength(len * k), r = p.getPointAtLength(Math.max(0, len * k - 4));
            const a = Math.atan2(q.y - r.y, q.x - r.x) * 180 / Math.PI;
            head.setAttribute('transform', 'translate(' + q.x + ' ' + q.y + ') rotate(' + a + ')');
            head.style.opacity = k > 0.08 ? 1 : 0;
          }
        } };
    },
    link(svg, a, b, cls) {
      const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, m = (x1 + x2) / 2;
      return UI.cable(svg, 'M' + x1 + ' ' + y1 + ' C' + m + ' ' + y1 + ' ' + m + ' ' + y2 + ' ' + (x2 - 22) + ' ' + y2, cls, true);
    }
  };

  // ---- beat 1: a partner knocks ----
  (function () {
    const { seg, eo, eob, lerp, TextFx } = kit;
    kit.scene('knock', {
      init(kit) {
        kit.stage.append(kit.h('<div class="ground"></div>'));
        kit.stage.append(kit.h('<div class="words" style="left:140px;top:130px;width:1400px"><p class="kicker knock-kick">A story in nine beats</p><h2 class="line">One umbrella for partners</h2><p class="sub knock-sub">It started with a new partner knocking on the door</p></div>'));
        const B = this.B = { w: { x: 180, y: 520, w: 320, h: 120 }, e: { x: 800, y: 520, w: 320, h: 120 }, c: { x: 1420, y: 520, w: 320, h: 120 } };
        this.svg = UI.art(kit);
        this.c1 = UI.link(this.svg, B.w, B.e, 'main');
        this.c2 = UI.cable(this.svg, 'M1120 552 C1270 552 1270 552 1398 552', 'main', true);
        this.c3 = UI.cable(this.svg, 'M1420 606 C1270 606 1270 606 1142 606', 'main', true);
        this.c4 = UI.cable(this.svg, 'M800 606 C650 606 650 606 522 606', 'bad', true);
        this.socks = {};
        this.socks.w = UI.sock(kit, 'partner', B.w.x, B.w.y, B.w.w, B.w.h, 'New partner');
        this.socks.e = UI.sock(kit, 'core', B.e.x, B.e.y, B.e.w, B.e.h, 'Platform');
        this.socks.c = UI.sock(kit, 'customer', B.c.x, B.c.y, B.c.w, B.c.h, 'Customer');
        for (const k in this.socks) kit.stage.append(this.socks[k]);
        this.tags = [
          kit.h('<p class="tag good" style="left:540px;top:470px">send this template</p>'),
          kit.h('<p class="tag good" style="left:1180px;top:470px">template</p>'),
          kit.h('<p class="tag good" style="left:1225px;top:630px">tap</p>'),
          kit.h('<p class="tag bad" style="left:430px;top:630px">and the tap back, with my ids?</p>')
        ];
        for (const g of this.tags) kit.stage.append(g);
        this.kick = kit.stage.querySelector('.knock-kick').style;
        this.sub = kit.stage.querySelector('.knock-sub').style;
        this.line = kit.stage.querySelector('.line');
      },
      render(t) {
        TextFx.fadeFromRight(this.line, t, -0.5);
        this.kick.opacity = eo(seg(t, 0.2, 0.8));
        this.sub.opacity = eo(seg(t, 1.0, 1.6));
        const rise = (el, t0) => { const k = eob(seg(t, t0, t0 + 0.8), 1.5); el.style.opacity = seg(t, t0, t0 + 0.3); el.style.transform = 'translateY(' + lerp(90, 0, k) + 'px)'; };
        rise(this.socks.w, 2.6); rise(this.socks.e, 2.9); rise(this.socks.c, 3.2);
        this.c1.draw(eo(seg(t, 3.8, 4.6)));
        this.c2.draw(eo(seg(t, 4.8, 5.4)));
        this.c3.draw(eo(seg(t, 5.6, 6.2)));
        this.c4.draw(eo(seg(t, 6.5, 7.4)));
        const show = (i, t0) => { this.tags[i].style.opacity = eo(seg(t, t0, t0 + 0.35)); };
        show(0, 4.3); show(1, 5.2); show(2, 6.0); show(3, 7.1);
        const wob = Math.sin(t * 2.1) * 1.5;
        this.tags[3].style.transform = 'rotate(' + (t > 7.1 ? wob : 0) + 'deg)';
      }
    });
  })();

  // ---- beat 2: three loops today ----
  (function () {
    const { seg, eo, eob, lerp, TextFx } = kit;
    const ROWS = [
      { y: 250, s: 1.0, p: 'Order system', send: 'template + order id', mem: 'remembers an order, by phone', fwd: 'location template', back: 'location + order id', cls: '' },
      { y: 520, s: 4.6, p: 'Property app', send: 'event, 16 kinds', mem: 'remembers a request, by phone', fwd: 'template + buttons', back: 'POST the tap, via a hand-built flow', cls: '' },
      { y: 790, s: 8.2, p: 'Marketing tools', send: 'template, via the relay', mem: 'remembers nothing', fwd: 'template', back: 'event, no ids', cls: 'bad' }
    ];
    kit.scene('three-loops', {
      init(kit) {
        kit.stage.append(kit.h('<div class="ground"></div>'));
        kit.stage.append(kit.h('<div class="words" style="left:140px;top:30px;width:1500px;gap:6px"><p class="kicker">Today</p><h2 class="line" style="font-size:72px">Three loops, three memories</h2></div>'));
        this.svg = UI.art(kit);
        this.rows = ROWS.map(r => {
          const P = { x: 140, y: r.y, w: 320, h: 96 }, E = { x: 800, y: r.y, w: 320, h: 96 }, C = { x: 1460, y: r.y, w: 320, h: 96 };
          const o = { r,
            socks: [UI.sock(kit, 'partner', P.x, P.y, P.w, P.h, r.p), UI.sock(kit, r.cls ? 'bad' : 'core', E.x, E.y, E.w, E.h, 'Platform'), UI.sock(kit, 'customer', C.x, C.y, C.w, C.h, 'Customer')],
            c1: UI.link(this.svg, P, E, r.cls || 'main'),
            c2: UI.link(this.svg, E, C, r.cls || 'main'),
            c3: UI.cable(this.svg, 'M1620 ' + r.y + ' C1620 ' + (r.y - 95) + ' 300 ' + (r.y - 95) + ' 300 ' + (r.y - 4), r.cls, true),
            tags: [
              kit.h('<p class="tag ' + (r.cls || 'good') + '" style="left:470px;top:' + (r.y + 104) + 'px">' + r.send + '</p>'),
              kit.h('<p class="tag ' + (r.cls || '') + '" style="left:812px;top:' + (r.y + 104) + 'px">' + r.mem + '</p>'),
              kit.h('<p class="tag ' + (r.cls || 'good') + '" style="left:1150px;top:' + (r.y + 104) + 'px">' + r.fwd + '</p>'),
              kit.h('<p class="tag ' + (r.cls || '') + '" style="left:700px;top:' + (r.y - 106) + 'px">' + r.back + '</p>')
            ] };
          o.socks.forEach(s => kit.stage.append(s)); o.tags.forEach(g => kit.stage.append(g));
          return o;
        });
        this.foot = kit.h('<p class="sub" style="position:absolute;left:140px;top:990px;width:1600px">Same job. Three wirings. Every new partner would add a fourth.</p>');
        kit.stage.append(this.foot);
        this.line = kit.stage.querySelector('.line');
      },
      render(t) {
        TextFx.fadeFromRight(this.line, t, -0.4);
        for (const o of this.rows) {
          const s = o.r.s;
          o.socks.forEach((el, i) => { const t0 = s + i * 0.15, k = eob(seg(t, t0, t0 + 0.7), 1.5); el.style.opacity = seg(t, t0, t0 + 0.25); el.style.transform = 'translateY(' + lerp(60, 0, k) + 'px)'; });
          o.c1.draw(eo(seg(t, s + 0.5, s + 1.1)));
          o.c2.draw(eo(seg(t, s + 1.4, s + 1.9)));
          o.c3.draw(eo(seg(t, s + 2.1, s + 3.0)));
          const at = [s + 0.9, s + 1.2, s + 1.7, s + 2.6];
          o.tags.forEach((g, i) => { const k = eo(seg(t, at[i], at[i] + 0.35)); g.style.opacity = k; g.style.transform = 'translateY(' + lerp(10, 0, k) + 'px)'; });
          o.tags[1].style.transform += ' translateY(' + (Math.sin(t * 1.7 + o.r.y) * 2) + 'px)';
        }
        this.foot.style.opacity = eo(seg(t, 11.0, 11.6));
      }
    });
  })();

  // ---- beat 3: first idea ----
  (function () {
    const { seg, eo, eob, lerp, TextFx } = kit;
    kit.scene('first-idea', {
      init(kit) {
        kit.stage.append(kit.h('<div class="ground"></div>'));
        kit.stage.append(kit.h('<div class="words" style="left:140px;top:110px;width:1500px"><p class="kicker">First idea</p><h2 class="line">Add one row at send time</h2><p class="sub fi-sub">Remember who asked, hand the answer back with their ids</p></div>'));
        const B = this.B = { p: { x: 180, y: 520, w: 320, h: 120 }, e: { x: 800, y: 520, w: 320, h: 120 }, c: { x: 1420, y: 520, w: 320, h: 120 } };
        this.svg = UI.art(kit);
        this.c1 = UI.link(this.svg, B.p, B.e, 'main');
        this.c2 = UI.cable(this.svg, 'M1120 552 C1270 552 1270 552 1398 552', 'main', true);
        this.c3 = UI.cable(this.svg, 'M1420 606 C1270 606 1270 606 1142 606', 'main', true);
        this.c4 = UI.cable(this.svg, 'M800 606 C650 606 650 606 522 606', 'main', true);
        this.socks = [UI.sock(kit, 'partner', B.p.x, B.p.y, B.p.w, B.p.h, 'Partner'), UI.sock(kit, 'core', B.e.x, B.e.y, B.e.w, B.e.h, 'Platform'), UI.sock(kit, 'customer', B.c.x, B.c.y, B.c.w, B.c.h, 'Customer')];
        this.socks.forEach(s => kit.stage.append(s));
        this.row = UI.sock(kit, 'hub', 700, 690, 520, 90, 'subscription row', 'font-size:30px');
        kit.stage.append(this.row);
        this.rowSub = kit.h('<p class="tag good" style="left:640px;top:800px">who asked · their ids · what to wait for · expiry</p>');
        kit.stage.append(this.rowSub);
        this.tags = [
          kit.h('<p class="tag good" style="left:520px;top:470px">template + subscribe</p>'),
          kit.h('<p class="tag good" style="left:1150px;top:470px">a tiny id in each button</p>'),
          kit.h('<p class="tag good" style="left:1180px;top:630px">the tap carries the id</p>'),
          kit.h('<p class="tag good" style="left:470px;top:630px">reaction + your ids</p>')
        ];
        this.tags.forEach(g => kit.stage.append(g));
        this.dot = kit.h('<div class="dot" style="left:0;top:0"></div>');
        kit.stage.append(this.dot);
        this.foot = kit.h('<div class="words" style="left:140px;top:930px;width:1600px;gap:8px"><p class="sub fi-neat" style="color:var(--second);font-weight:700">Neat. One row. Done?</p><p class="sub fi-but">We looked deeper before building it.</p></div>');
        kit.stage.append(this.foot);
        this.line = kit.stage.querySelector('.line');
        this.sub = kit.stage.querySelector('.fi-sub').style;
        this.neat = kit.stage.querySelector('.fi-neat').style;
        this.but = kit.stage.querySelector('.fi-but').style;
      },
      render(t) {
        TextFx.fadeFromRight(this.line, t, -0.4);
        this.sub.opacity = eo(seg(t, 0.8, 1.4));
        this.socks.forEach((el, i) => { const t0 = 1.4 + i * 0.2, k = eob(seg(t, t0, t0 + 0.7), 1.5); el.style.opacity = seg(t, t0, t0 + 0.25); el.style.transform = 'translateY(' + lerp(70, 0, k) + 'px)'; });
        this.c1.draw(eo(seg(t, 2.2, 2.9)));
        const rk = eob(seg(t, 3.0, 3.7), 1.7);
        this.row.style.opacity = seg(t, 3.0, 3.2);
        this.row.style.transform = 'scale(' + lerp(0.6, 1, rk) + ')';
        this.rowSub.style.opacity = eo(seg(t, 3.5, 3.9));
        this.c2.draw(eo(seg(t, 3.9, 4.5)));
        const dk = eo(seg(t, 4.4, 5.3));
        const q = this.c2.el.getPointAtLength(this.c2.len * dk);
        this.dot.style.left = (q.x - 9) + 'px'; this.dot.style.top = (q.y - 9) + 'px';
        this.dot.style.opacity = t > 4.4 && t < 5.4 ? 1 : 0;
        this.c3.draw(eo(seg(t, 5.5, 6.1)));
        this.c4.draw(eo(seg(t, 6.4, 7.2)));

        this.end = kit.h('<div class="words" style="left:140px;top:340px;width:1640px;gap:28px;align-items:center;text-align:center"><h2 class="big">One umbrella for partners</h2><p class="sub" style="font-size:44px;color:var(--second)">One umbrella. Three moves. Order still to agree.</p></div>');
        this.dotEl = kit.h('<div class="dot" style="left:951px;top:620px"></div>');
        kit.stage.append(this.end, this.dotEl);
        this.line = kit.stage.querySelector('.line');
        this.bigEl = this.end.querySelector('.big');
      },
      render(t) {
        const gone = 1 - eo(seg(t, 6.6, 7.2));
        TextFx.fadeFromRight(this.line, t, -0.4);
        this.head.style.opacity = gone;
        const rise = (el, t0) => { const k = eob(seg(t, t0, t0 + 0.7), 1.5); el.style.opacity = seg(t, t0, t0 + 0.25) * gone; el.style.transform = 'translateY(' + lerp(50, 0, k) + 'px) scale(' + lerp(1, 0.92, 1 - gone) + ')'; };
        this.cards.forEach(o => { rise(o.box, o.c.s); o.tag.style.opacity = eo(seg(t, o.c.s + 0.5, o.c.s + 0.9)) * gone; });
        this.order.style.opacity = eo(seg(t, 4.4, 4.8)) * gone;
        this.steps.forEach((s, i) => rise(s, 4.6 + i * 0.5));
        this.arrows.forEach((a, i) => { a.draw(eo(seg(t, 5.0 + i * 0.5, 5.4 + i * 0.5))); });
        this.svg.style.opacity = gone;
        TextFx.fadeFromRight(this.bigEl, t, 7.1, { stagger: 0.12, dur: 0.6, dx: 30 });
        this.end.style.opacity = t > 7.0 ? 1 : 0;
        this.end.querySelector('.sub').style.opacity = eo(seg(t, 8.0, 8.6));
        const dk = eob(seg(t, 7.9, 8.5), 1.8);
        this.dotEl.style.opacity = seg(t, 7.9, 8.1);
        this.dotEl.style.transform = 'scale(' + lerp(0.2, 1.4, dk) * (1 + Math.sin(t * 2.5) * 0.06) + ')';
        this.bigEl.style.transform = 'translateY(' + (-(t - 7) * 1.2) + 'px)';
      }
    });
  })();

  // ---- the presenter: nine beats, click or key to advance ----
  const BEATS = [
    { id: 'knock', name: 'A partner knocks', dur: 8 },
    { id: 'three-loops', name: 'Three loops today', dur: 12 },
    { id: 'first-idea', name: 'First idea', dur: 9 },
    { id: 'deeper', name: 'We looked deeper', dur: 8 },
    { id: 'exits', name: 'Three exits', dur: 10 },
    { id: 'doors-in', name: 'Three doors in', dur: 9 },
    { id: 'dead-wires', name: 'Dead and doubled', dur: 8 },
    { id: 'umbrella', name: 'One umbrella', dur: 16 },
    { id: 'why', name: 'Why this one', dur: 10 }
  ];
  const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
  const hudN = document.getElementById('hud-n'), hudName = document.getElementById('hud-name'), barFill = document.getElementById('bar-fill'), dots = document.getElementById('dots'), start = document.getElementById('start');
  BEATS.forEach(() => dots.append(h('<i></i>')));
  const boxes = BEATS.map(b => { const box = h('<div class="scene"></div>'); stage.insertBefore(box, start); return box; });
  // build every scene once, at identity scale, so cable lengths measure right
  BEATS.forEach((b, i) => { const sk = Object.create(kit); sk.stage = boxes[i]; SCENES[b.id].init(sk); SCENES[b.id].render(0); });

  let cur = 0, t0 = 0, offset = 0, playing = false, started = false;
  try { const s = parseInt(localStorage.getItem('umbrella-beat') || '0', 10); if (s >= 0 && s < BEATS.length) cur = s; } catch (e) {}
  function now() { return performance.now() / 1000; }
  function localT() { return playing ? offset + (now() - t0) : offset; }
  function show(i, play, fromEnd) {
    cur = Math.max(0, Math.min(BEATS.length - 1, i));
    boxes.forEach((b, k) => b.classList.toggle('on', k === cur));
    offset = fromEnd ? BEATS[cur].dur : 0; t0 = now(); playing = play;
    hudN.textContent = String(cur + 1); hudName.textContent = BEATS[cur].name;
    Array.from(dots.children).forEach((d, k) => { d.className = k < cur ? 'done' : k === cur ? 'now' : ''; });
    try { localStorage.setItem('umbrella-beat', String(cur)); } catch (e) {}
    render();
  }
  function render() {
    const t = localT(), b = BEATS[cur];
    SCENES[b.id].render(t);
    barFill.style.width = (100 * Math.min(1, t / b.dur)) + '%';
    start.style.opacity = started ? 0 : 1;
  }
  function advance() {
    if (!started) { started = true; show(cur, true); return; }
    const t = localT();
    if (t < BEATS[cur].dur - 0.05) { offset = BEATS[cur].dur; t0 = now(); render(); return; }   // finish this beat
    if (cur < BEATS.length - 1) show(cur + 1, true);
  }
  function back() { started = true; if (cur > 0) show(cur - 1, true, true); else show(0, true, true); }
  function replay() { started = true; show(cur, true); }
  function fit() { const s = Math.min((wrap.clientWidth - 32) / 1920, (wrap.clientHeight - 24) / 1080); stage.style.transform = 'scale(' + s + ')'; }
  wrap.addEventListener('click', advance);
  document.getElementById('btn-next').addEventListener('click', e => { e.stopPropagation(); advance(); });
  document.getElementById('btn-prev').addEventListener('click', e => { e.stopPropagation(); back(); });
  document.getElementById('btn-replay').addEventListener('click', e => { e.stopPropagation(); replay(); });
  document.getElementById('btn-full').addEventListener('click', e => { e.stopPropagation(); const el = document.documentElement; if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen(); } else if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); } });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter' || e.key === 'PageDown') { e.preventDefault(); advance(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
    else if (e.key === 'r' || e.key === 'R') { replay(); }
    else if (e.key === 'f' || e.key === 'F') { document.getElementById('btn-full').click(); }
    else if (e.key === 'Home') { show(0, true); }
  });
  window.addEventListener('resize', fit);
  fit();
  show(cur, false);
  (function loop() { if (playing) render(); requestAnimationFrame(loop); })();
})();
</script>
